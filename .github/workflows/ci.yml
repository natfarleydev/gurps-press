name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # Tytanic bundles its own Typst compiler, so each tytanic version tests
    # one Typst version. typst.toml promises 0.13 as the minimum.
    strategy:
      fail-fast: false
      matrix:
        include:
          - typst: "0.13"
            tytanic: 0.2.2
          - typst: "0.14"
            tytanic: 0.3.4
          - typst: "0.15"
            tytanic: 0.4.1
    name: Tests (Typst ${{ matrix.typst }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install tytanic
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: tytanic@${{ matrix.tytanic }}

      - name: Run tests
        run: tt run --no-fail-fast

      - name: Upload test output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: test-output-typst-${{ matrix.typst }}
          path: |
            tests/**/diff/*.png
            tests/**/out/*.png
            tests/**/ref/*.png
          retention-days: 5

  install:
    # `just install` must work wherever authors write: on Windows Typst's
    # data directory is a `C:\...` path, not a POSIX one.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just

      - uses: typst-community/setup-typst@48aeee7543d37f01afd1ffb27307dc277387ba13 # v4
        with:
          typst-version: "0.15"

      - name: Install as @local
        run: just install

      - name: Leave the repository untouched
        run: test -z "$(git status --porcelain)"

      - name: Compile a document that imports the install
        run: |
          printf '#import "@local/gurps-press:%s": *\n#dice(3, -1)\n' \
            "$(just version)" > "$RUNNER_TEMP/smoke.typ"
          typst compile "$RUNNER_TEMP/smoke.typ"

  docs:
    name: Docs, spelling and package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just,typos,typstyle@0.15.1

      - uses: typst-community/setup-typst@48aeee7543d37f01afd1ffb27307dc277387ba13 # v4
        with:
          typst-version: "0.15"

      - name: Formatting
        run: just fmt-check

      - name: Spell check
        run: just spell

      - name: Build manual and pictures
        run: just doc

      - name: Package
        run: |
          # Local tool state (e.g. Claude Code worktrees) must never ship.
          mkdir -p .claude && touch .claude/settings.local.json
          just package out
          test ! -e "out/gurps-press/$(just version)/.claude"

      - name: Check package against Typst Universe rules
        run: |
          docker run --rm -v "$PWD/out/gurps-press/$(just version):/data" \
            ghcr.io/typst/package-check check

      - name: Upload built docs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs
          path: |
            docs/manual.pdf
            docs/*.png
          retention-days: 5
