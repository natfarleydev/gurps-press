name: Release
# Push a tag `vX.Y.Z` (matching typst.toml) to build the package bundle and
# attach it to a GitHub release. Submitting to Typst Universe is still a
# manual pull request to typst/packages; see CLAUDE.md "Releasing".
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: taiki-e/install-action@v2
        with:
          tool: just,tytanic@0.4.1

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15"

      - name: Check tag matches typst.toml
        run: |
          version="$(grep -m1 '^version' typst.toml | cut -d'"' -f2)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match typst.toml version ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Test
        run: just test

      - name: Build docs and package
        run: |
          just doc
          just package out
          cd out && zip -r "../gurps-ink-${VERSION}.zip" gurps-ink

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: gurps-ink-${{ env.VERSION }}.zip
          generate_release_notes: true
